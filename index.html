/* ---- draft ---- */
// draft à 2 : 3 paquets (J1, J2, joueur invisible). L'invisible défausse une carte au hasard, puis les paquets tournent dans un sens tiré au début.
function draftEndRound(D){
  if(!D.packs[2]){ D.packs=[D.packs[1],D.packs[0]]; D.round++; return; }
  const gp=D.packs[2]; if(gp.length){ const g=gp[Math.floor(Math.random()*gp.length)]; D.packs[2]=gp.filter(x=>x!==g); (D.burn=D.burn||[]).push(g); }
  const d=D.dir||1, np=[]; [0,1,2].forEach(s=>np[(s+d+3)%3]=D.packs[s]); D.packs=np; D.round++;
}
function draftDirHTML(D){ if(!D||!D.packs||!D.packs[2]) return ''; return ` · <span title="Sens de rotation des paquets">${D.dir===1?'↻ sens horaire':'↺ sens anti-horaire'}</span>`; }
// draft par simulation : chaque carte du paquet est testée dans des manches simulées avec les cartes déjà prises (banc : 74 % contre l'ancien draft)
function* aiDraftGen(mine,pack){ // générateur : rend la main après chaque simulation (calcul en arrière-plan)
  const all=DEFS.map(c=>c.id), K=Math.max(1,AIW.dk||16), fresh={}; all.forEach(id=>fresh[id]=newCardState(id));
  const base={phase:'reveal',mode:'sealed',game:1,manche:1,players:[0,1].map(i=>({name:'IA'+i,cs:fresh,deck:[],hand:[],line:[],ko:[],discard:[],vp:0,pc:0})),log:[],pending:[],step:0,turn:0,results:[],revived:{}};
  const M=[]; for(let i=0;i<K;i++){ const pool=mine.length>=3?mine:mine.concat(shuffle(all.filter(x=>!mine.includes(x))).slice(0,3-mine.length)); M.push([shuffle(pool).slice(0,3),shuffle(all).slice(0,4),Math.floor(Math.random()*4)]); }
  let best=pack[0], bs=-1e9;
  for(const c of pack){ let s=0;
    for(const [three,opp,pos] of M){ const me=three.filter(x=>x!==c).slice(0,3); while(me.length<3) me.push(shuffle(all.filter(x=>x!==c&&!me.includes(x)))[0]); me.splice(pos,0,c);
      const o=opp.filter(x=>!me.includes(x)); while(o.length<4) o.push(shuffle(all.filter(x=>!me.includes(x)&&!o.includes(x)))[0]);
      const r=simManche(base,o,me); s+=(r.vp[1]-r.vp[0])+0.35*(r.ch[1]-r.ch[0]); yield null; }
    s=s/K+Math.random()*(0.01+AIW.noise);
    if(AIW.alTheme&&mine.length>=2){ const R=alRefs(), th=alTheme(mine); if(th&&R[c]&&(th.some(k=>R[c][k])||R[c].any)) s+=AIW.alTheme; else if(!th&&R[c]) s+=AIW.alTheme*0.5; }
    if(AIW.alDraft){ const R=alRefs(), frac=mine.filter(x=>R[x]).length/Math.max(3,mine.length); s+=AIW.alDraft*(R[c]?0.5+frac:frac*0.3); }
    if(s>bs){ bs=s; best=c; } }
  return best;
}
function aiDraftSim(mine,pack){ const g=aiDraftGen(mine,pack); let r; do{ r=g.next(); }while(!r.done); return r.value; }
// version asynchrone : quelques ms de calcul puis on laisse respirer l'interface (le joueur peut choisir pendant ce temps)
const DSIM={cache:{},jobs:{}};
const dsimKey=(tag,mine,pack)=>tag+'|'+mine.join(',')+'|'+pack.slice().sort((a,b)=>a-b).join(',');
function aiDraftAsync(tag,mine,pack,aw){
  const key=dsimKey(tag,mine,pack);
  if(key in DSIM.cache) return Promise.resolve(DSIM.cache[key]);
  if(DSIM.jobs[key]) return DSIM.jobs[key];
  const g=(()=>{ const k=AIW; AIW=aw; try{ return aiDraftGen(mine.slice(),pack.slice()); } finally{ AIW=k; } })();
  return DSIM.jobs[key]=new Promise(res=>{
    const step=()=>{ const k=AIW; AIW=aw; let r; const t0=performance.now();
      try{ do{ r=g.next(); }while(!r.done&&performance.now()-t0<14); } catch(e){ console.error(e); r={done:true,value:pack[0]}; } finally{ AIW=k; }
      if(r.done){ DSIM.cache[key]=r.value; delete DSIM.jobs[key]; const ks=Object.keys(DSIM.cache); if(ks.length>60) delete DSIM.cache[ks[0]]; res(r.value); }
      else setTimeout(step,8); };
    setTimeout(step,0); });
}
function campDraftKick(){ // campagne contre l'IA : l'IA prépare son choix pendant que le joueur choisit
  if(!S||!S.ai||NET.on||UI.tuto||S.phase!=='draft'||!S.draft||S.draft.turn!==0) return;
  const D=S.draft; if(!D.packs[AIP]||!D.packs[AIP].length) return;
  aiUseLevel(); aiDraftAsync('c'+S.game+'-'+D.round,P(AIP).deck,D.packs[AIP],Object.assign({},AIW));
}
function aiDraftChoose(pack){ return aiDraftSim(P(AIP).deck.slice(),pack); }
function aiDraftPick(){
  const D=S.draft, pack=D.packs[AIP];
  const key=dsimKey('c'+S.game+'-'+D.round,P(AIP).deck,pack);
  if(!(key in DSIM.cache)){ if(!UI.dWait){ UI.dWait=true; aiDraftAsync('c'+S.game+'-'+D.round,P(AIP).deck,pack,Object.assign({},AIW)).then(()=>{ UI.dWait=false; if(S&&S.phase==='draft'&&S.draft===D&&D.turn===AIP) aiDraftPick(); }); } return; }
  const best=DSIM.cache[key];
  stDraftPick(S.stc,AIP,D.round+1,best,pack);

function simManche(base,l0,l1){

function aiLiteBase(){ const b=clone(S); b.log=[]; b.stc=null; b.lastFx=null; b.drawFx=null; b.pending=[]; b.skipped=[]; return b; }

// matchups communs (mêmes tirages pour toutes les options => comparaison juste)
function aiMatchups(focusId,K){

function aiScore(base,M){

  const wc=aiChW(AIW.wCh); let s=0; for(const [l0,l1] of M){ const r=simManche(base,l0,l1); s+=(r.vp[1]-r.vp[0])+wc*(r.ch[1]-r.ch[0])+AIW.wSurv*(r.surv[1]-r.surv[0]); }

// comme aiScore, mais l'IA place ses 4 cartes au mieux (max sur plusieurs ordres) : c'est là que les allégeances paient

      let v=0; for(const l0 of O){ const r=simManche(base,l0,o); v+=(r.vp[1]-r.vp[0])+wc*(r.ch[1]-r.ch[0])+AIW.wSurv*(r.surv[1]-r.surv[0]); }

}
function aiNeeds(){ // le deck manque-t-il de force ou de vie face à l'adversaire ?
  const avg=(pl,k)=>{ const v=Object.values(P(pl).cs); return v.reduce((s,c)=>s+c[k],0)/(v.length||1); };
  const myA=avg(AIP,'atk'), myV=avg(AIP,'vie'), opA=avg(0,'atk'), opV=avg(0,'vie');

}
// cartes dont les effets dépendent des allégeances (lu dans le texte des effets)
let AL_REF=null;
document.addEventListener('change',e=>{ if(e.target&&e.target.id==='cset'){ try{ localStorage.setItem('zh_set',e.target.value); }catch(_){} useSet(e.target.value); } });
function alRefs(){ if(AL_REF) return AL_REF; AL_REF={};
  Object.keys(FX).forEach(id=>{ const f=FX[id]; let src=''; ['c1','e1','c2','e2','draw'].forEach(k=>{ if(f&&f[k]) src+=f[k].toString(); });
    const r={S:0,E:0,L:0,any:0}; let m; const re=/\b(al|only)\([^()]*?,'([SEL])'\)/g; while((m=re.exec(src))) r[m[2]]++;
    r.any=(src.match(/\b(share|alN|all3)\(/g)||[]).length; if(r.S||r.E||r.L||r.any) AL_REF[+id]=r; });
  return AL_REF; }
function alTheme(ids){ const R=alRefs(), d={S:0,E:0,L:0}; ids.forEach(id=>{ const r=R[id]; if(r) ['S','E','L'].forEach(k=>d[k]+=r[k]+r.any*0.5); });
  const o=['S','E','L'].sort((a,b)=>d[b]-d[a]); if(!d[o[0]]) return null; return d[o[1]]>=0.6*d[o[0]]?[o[0],o[1]].sort():[o[0]]; }
function alDemand(pl){ const R=alRefs(), d={S:0,E:0,L:0}; Object.keys(P(pl).cs).forEach(id=>{ const r=R[id]; if(!r) return; const c=P(pl).cs[id], D=DEF[id];
    const w=(c.p1>=D.c1?1:0.5); ['S','E','L'].forEach(k=>d[k]+=w*(r[k]+r.any*0.5)); }); return d; }
function aiCandidates(id){
  const c=P(AIP).cs[id], d=DEF[id], L=[];
  if(c.atk<10) L.push({id,act:'atk',cost:1,apply:x=>{x.atk++;}});
  if(c.vie<10) L.push({id,act:'vie',cost:1,apply:x=>{x.vie++;}});
  if(c.p1<d.c1){ const r=d.c1-c.p1; L.push({id,act:'p1',cost:r,apply:x=>{x.p1=d.c1;}}); }
  else if(c.p2<d.c2){ const r=d.c2-c.p2; L.push({id,act:'p2',cost:r,apply:x=>{x.p2=d.c2;}}); }
  ['S','E','L'].forEach(k=>{ if(!c.al[k]) L.push({id,act:'al',key:k,cost:1,apply:x=>{x.al[k]=true;}}); });
  (d.pos.txt||[]).forEach((t,i)=>{ if(t[2]||c.txt[i]) return; L.push({id,act:'txt',i,cost:1,apply:x=>{x.txt[i]=true;}}); });

// ---- projets d'allégeance : l'IA évalue des plans à plusieurs coches (ex. Lune+Soleil sur 5 héros + débloquer les pouvoirs qui en profitent)
function aiProjects(){
  if(!AIW.alProj) return null;
  const key=rkey()+'-'+AIP+'-'+P(AIP).name+'-'+Object.keys(P(AIP).cs).join(','); S.aiPlanC=S.aiPlanC||{}; if(S.aiPlanC.key===key) return S.aiPlanC.plan;
  const base=aiLiteBase(), R=alRefs(), cs0=base.players[AIP].cs, ids=Object.keys(cs0).map(Number);
  const rem=4*((6-S.game)*3+(3-S.manche)+1);
  const M=[]; const opp=Object.keys(P(0).cs).map(Number); for(let i=0;i<AIW.K*2;i++) M.push([sampleN(opp,4),sampleN(ids,4)]);
  const NP=AIW.alPerm||1, SC=(b)=>NP>1?aiScoreP(b,M,NP):aiScore(b,M);
  const s0=SC(base); let best=null;
  let sets=[['S'],['E'],['L'],['S','E'],['S','L'],['E','L']];
  const nm=P(AIP).name; S.aiCommit=S.aiCommit||{}; const ck=AIW.alCommit&&S.aiCommit[nm];
  if(ck) sets=[ck]; else if(AIW.alTheme){ const th=alTheme(ids); if(th) sets=[th]; }
  for(const ks of sets) for(const T of (AIW.alT||[4,6])) for(const pw of [0,1]){
    const cs=clone(cs0), tg={}; let cost=0;
    const refs=id=>R[id]&&(ks.some(k=>R[id][k])||R[id].any);
    if(pw){ ids.filter(refs).forEach(id=>{ const c=cs[id],d=DEF[id];
      if(d.c1&&c.p1<d.c1&&d.c1-c.p1<=5){ cost+=d.c1-c.p1; c.p1=d.c1; (tg[id]=tg[id]||{al:[]}).p1=1; }
      if(d.c2&&c.p1>=d.c1&&c.p2<d.c2&&d.c2-c.p2<=5){ cost+=d.c2-c.p2; c.p2=d.c2; (tg[id]=tg[id]||{al:[]}).p2=1; } }); }
    for(const k of ks){ let have=ids.filter(id=>cs[id].al[k]).length;
      const cand=ids.filter(id=>!cs[id].al[k]).sort((a,b)=>{ const sc=id=>(ks.some(q=>cs[id].al[q])?2:0)+(R[id]?1:0)+Math.random()*0.5; return sc(b)-sc(a); });
      for(const id of cand){ if(have>=T) break; cs[id].al[k]=true; have++; cost++; (tg[id]=tg[id]||{al:[]}).al.push(k); } }

    while(n>0&&j<200){ const c=ca[order[j%order.length]]; const k=(j%2)?'vie':'atk'; if(c[k]<10){ c[k]++; n--; } j++; }
    const b3=Object.assign({},base); b3.players=base.players.slice(); b3.players[AIP]=Object.assign({},base.players[AIP],{cs:ca});
    const alt=SC(b3)-s0, adv=(gain-alt)/cost;
    const advF=AIW.alCommit?Math.max(adv,AIW.alFloor||0):adv;
    if(advF>0&&(!best||advF>best.adv)) best={ks,T,pw,tg,adv:advF,gain,alt,cost};
  }

}
function aiBestCheck(){
  const base=aiLiteBase(), need=aiNeeds(), K=AIW.K; let best=null;
  const plan=aiProjects();
  const dem=AIW.alPlan?alDemand(AIP):null, demT=dem?(dem.S+dem.E+dem.L)||1:1;
  const left=Math.max(0,6-S.game)+(3-S.manche)/3;
  for(const id of mancheCards(AIP)){
    const M=aiMatchups(id,K), cards=base.players[AIP].cs, orig=cards[id];
    const s0=aiScore(base,M);
    for(const o of aiCandidates(id)){
      const x=clone(orig); o.apply(x); cards[id]=x;
      // un pouvoir est vu dans son ensemble : on mesure ce qu'il apporte une fois débloqué
      if(o.act==='p1'&&DEF[id].pos.txt){ /* les ronds d'effet du pouvoir comptent déjà via les cases cochées */ }
      let gain=(aiScore(base,M)-s0)/o.cost;
      if(o.act==='atk') gain+=need.atk; if(o.act==='vie') gain+=need.vie;
      if(o.act==='al'||o.act==='txt') gain*=AIW.alMul;
      if(o.act==='al'&&dem){ gain+=AIW.alPlan*(dem[o.key]/demT)*(left/5); }
      if(plan&&plan.tg[id]){ const g=plan.tg[id]; if((o.act==='al'&&g.al.includes(o.key))||(o.act==='p1'&&g.p1)||(o.act==='p2'&&g.p2)) gain+=AIW.alProj*plan.adv*3; }

      gain+=Math.random()*(0.02+AIW.noise);

    }
  }

}

function dealPool(ban,n){
  const avail=ALL_IDS().filter(id=>!ban.includes(id)); const sh=shuffle(avail);
  if(avail.length>=12*n) return Array.from({length:n},(_,i)=>sh.slice(i*12,i*12+12));
  return Array.from({length:n},()=>shuffle(avail).slice(0,12));
}
function poolDone(){
  const Q=UI.pl; if(!Q) return; const ban=Q.ban.slice(); if(ALL_IDS().length-ban.length<12) return;
  if(TT.on&&!S){ if(!TT.isHost) return; tourPoolDone(ban); UI.pl=null; return; }
  const decks=dealPool(ban,2); S.players.forEach((p,i)=>p.deck=decks[i]); S.poolBan=ban; UI.pl=null;
  doPreparation(); S.handoff=null; save(); render(); scrollTop0();
}
function poolScreen(){ return poolHTML('p-'+(S.stc&&S.stc.id),2,!isGuest()); }

/* ---- tournoi ---- */
function tourBuild(seat,ids){
  const T=TT.T; if(T.phase!=='build'||!validBuild(ids)) return; T.builds[seat]=ids.slice();
  if(T.builds.every(Boolean)){ T.dpDecks=T.builds.map(b=>b.slice()); T.dpChoice=T.builds.map(()=>null); T.builds=null; T.phase='dprep'; }
  tourBroadcast();
}
function tourPoolDone(ban){
  const T=TT.T; if(T.phase!=='pool') return; const decks=dealPool(ban,T.n||4);
  tSeats().forEach(s=>T.pdata[s]=prep4(decks[s])); T.poolBan=ban; T.phase='prep'; T.prepId=Math.random().toString(36).slice(2,8); tourBroadcast();
}

/* ---------- hover zoom (mouse only) ---------- */
const HZ={timer:null,el:null,src:null};
const BIGIMG={};
(function preload(){ const ids=DEFS.map(d=>d.id); let i=0;
  const thumbs=()=>{ ids.forEach(id=>{ const im=new Image(); im.src=imgSrc(id,false); }); };
  const bigs=()=>{ if(i>=ids.length) return; for(let k=0;k<6&&i<ids.length;k++,i++){ const id=ids[i]; if(!BIGIMG[id]){ const im=new Image(); im.src=imgSrc(id,true); BIGIMG[id]=im; } } setTimeout(bigs,400); };
  setTimeout(thumbs,800); setTimeout(bigs,3000); })();
function hideHover(){ clearTimeout(HZ.timer); HZ.timer=null; HZ.src=null; if(HZ.el){ HZ.el.remove(); HZ.el=null; } }
function showHover(z,x,y){
  const id=+z.dataset.id; if(!id||!DEF[id]) return;
  const pls=z.dataset.pl; const pl=(pls===''||pls==null||!S||!S.players||!P(+pls)||!P(+pls).cs[id])?null:+pls;
  let unit=null; if(pl!=null){ unit=P(pl).line.find(u=>u.id===id&&u.rev)||null; }
  const el=document.createElement('div'); el.id='hoverzoom';
  const tcs=(!S&&TT.T&&TT.T.pdata&&pls!==''&&pls!=null&&TT.T.pdata[+pls]&&TT.T.pdata[+pls].cs[id])||null;
  el.innerHTML=tcs?cardHTML(+pls,id,{big:false,cs:tcs}):cardHTML(pl,id,{big:false,unit});
  const big=BIGIMG[id]; const img=el.querySelector('img');
  if(img){ if(big&&big.complete&&big.naturalWidth) img.src=big.src; else { const bi=new Image(); bi.onload=()=>{ if(HZ.el===el) img.src=bi.src; }; bi.src=imgSrc(id,true); BIGIMG[id]=bi; } }
  document.body.appendChild(el); HZ.el=el; placeHover(x,y);
}
function placeHover(x,y){
  const el=HZ.el; if(!el) return;
  const w=el.offsetWidth,h=el.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  let left=x+24; if(left+w>vw-8) left=x-w-24; if(left<8) left=Math.max(8,(vw-w)/2);
  let top=y-h/2; top=Math.min(Math.max(8,top),vh-h-8);
  el.style.left=left+'px'; el.style.top=top+'px';
}
if(window.matchMedia&&matchMedia('(hover: hover) and (pointer: fine)').matches){
  let lx=0,ly=0;
  document.addEventListener('mousemove',e=>{ lx=e.clientX; ly=e.clientY; if(HZ.el) placeHover(lx,ly); },{passive:true});
  document.addEventListener('mouseover',e=>{
    const z=e.target.closest&&e.target.closest('.zc[data-id]');
    if(z===HZ.src) return;
    hideHover();
    if(!z||z.closest('.ovl')||z.closest('#hoverzoom')||z.closest('.fxcard')||(UI&&UI.tuto)) return;
    HZ.src=z; HZ.timer=setTimeout(()=>{ if(HZ.src===z&&document.body.contains(z)) showHover(z,lx,ly); },800);
  });
  document.addEventListener('mousedown',hideHover,true);
  window.addEventListener('scroll',hideHover,{passive:true});
}

/* ---------- long press zoom (tactile) ---------- */
const LP={t:null,x:0,y:0,fired:false};
const ZV={list:[],i:0,el:null};
function zvItems(z){
  const seen=new Set(), list=[];
  document.querySelectorAll('#app .zc[data-id]').forEach(el=>{ if(el.closest('.cth')&&!z.closest('.cth')) return; const id=+el.dataset.id; if(!id||!DEF[id]) return;
    const k=(el.dataset.pl||'')+'-'+id; if(seen.has(k)) return; seen.add(k); list.push({el,pl:el.dataset.pl===''||el.dataset.pl==null?null:+el.dataset.pl,id}); });
  let i=list.findIndex(x=>x.el===z); if(i<0){ const k=(z.dataset.pl||'')+'-'+z.dataset.id; i=Math.max(0,list.findIndex(x=>((x.pl??'')+'-'+x.id)===k)); }
  return {list,i};
}
function openZV(z){
  const r=zvItems(z); if(!r.list.length) return; ZV.list=r.list; ZV.i=r.i;
  if(!ZV.el){ const el=document.createElement('div'); el.id='zv'; document.body.appendChild(el); ZV.el=el;
    el.addEventListener('click',e=>{ e.stopPropagation(); const b=e.target.closest('[data-zv]'); if(b){ const a=b.dataset.zv; if(a==='x') closeZV(); else zvGo(a==='n'?1:-1); return; } if(!e.target.closest('.zvcard')) closeZV(); });
    let sx=0,sy=0,n=0; el.addEventListener('touchstart',e=>{ n=e.touches.length; sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
    el.addEventListener('touchend',e=>{ if(n>1) return; const tt=e.changedTouches[0], dx=tt.clientX-sx, dy=tt.clientY-sy; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3) zvGo(dx<0?1:-1); },{passive:true}); }
  zvRender();
}
function zvGo(d){ const n=ZV.list.length; ZV.i=(ZV.i+d+n)%n; zvRender(); }
function closeZV(){ LP.fired=false; if(ZV.el){ ZV.el.remove(); ZV.el=null; } }
function zvRender(){
  const it=ZV.list[ZV.i]; if(!it||!ZV.el) return; let unit=null;
  if(it.pl!=null&&S&&S.players&&P(it.pl)) unit=P(it.pl).line.find(u=>u.id===it.id&&u.rev)||null;
  const pl=(it.pl!=null&&S&&S.players&&P(it.pl)&&P(it.pl).cs[it.id])?it.pl:null;
  const tcs=(!S&&TT.T&&TT.T.pdata&&it.pl!=null&&TT.T.pdata[it.pl]&&TT.T.pdata[it.pl].cs[it.id])||null;
  ZV.el.innerHTML=`<div class="zvcard">${tcs?cardHTML(it.pl,it.id,{big:true,cs:tcs}):cardHTML(pl,it.id,{big:true,unit})}</div>
    <div class="zvbar">${ZV.list.length>1?'<button data-zv="p">◀</button>':''}<span>${ZV.i+1} / ${ZV.list.length}</span>${ZV.list.length>1?'<button data-zv="n">▶</button>':''}<button data-zv="x">✕</button></div>`;
}
document.addEventListener('touchstart',e=>{
  clearTimeout(LP.t); LP.fired=false;
  if(e.touches.length!==1) return;
  const z=e.target.closest&&e.target.closest('.zc[data-id]'); if(!z||z.closest('#zv')||document.body.classList.contains('tuto')) return;
  const tt=e.touches[0]; LP.x=tt.clientX; LP.y=tt.clientY;
  LP.t=setTimeout(()=>{ LP.fired=true; if(navigator.vibrate) try{navigator.vibrate(15);}catch(_){} openZV(z); },450);
},{passive:true});
document.addEventListener('touchmove',e=>{ const tt=e.touches[0]; if(Math.hypot(tt.clientX-LP.x,tt.clientY-LP.y)>10) clearTimeout(LP.t); },{passive:true});
document.addEventListener('touchend',e=>{ clearTimeout(LP.t); if(LP.fired&&e.cancelable) e.preventDefault(); },{passive:false});
document.addEventListener('touchcancel',()=>clearTimeout(LP.t),{passive:true});
document.addEventListener('contextmenu',e=>{ if(e.target.closest&&e.target.closest('.zc')) e.preventDefault(); });
document.addEventListener('click',e=>{ if(LP.fired){ LP.fired=false; e.stopImmediatePropagation(); e.preventDefault(); } },true);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act;
  if(act==='ovl'){ if(e.target===t) closeModal(); return; }
  // circle clicks: context = nearest card element
  if(['atk','vie','p1','p2','al','txt','draw'].includes(act)){
    const z=t.closest('.zc'); if(z&&z.classList.contains('dpcard')){ if(act==='al') dpClickAl(+z.dataset.id,t.dataset.key); return; } if(!z||z.dataset.pl==='') return;
    applyCheck(+z.dataset.pl,+z.dataset.id,act,t.dataset.i!=null?+t.dataset.i:null,t.dataset.key);
    return;
  }
  switch(act){
    case 'noop': return;
    case 'bdpage': if(UI.bd){ UI.bd.page+=+t.dataset.d; render(); } return;
    case 'bdsel': { const B=UI.bd; if(!B||B.done) return; const id=+t.dataset.id; if(B.sel.includes(id)) B.sel=B.sel.filter(x=>x!==id); else if(B.sel.length<12) B.sel.push(id); else toast('Ton deck a déjà 12 héros : retire une carte avant d’en ajouter une.'); render(); return; }
    case 'bdrem': { const B=UI.bd; if(!B||B.done) return; B.sel=B.sel.filter(x=>x!==+t.dataset.id); render(); return; }
    case 'bdok': buildDone(); return;
    case 'plpage': if(UI.pl){ UI.pl.page+=+t.dataset.d; render(); } return;
    case 'plban': { const Q=UI.pl; if(!Q) return; const id=+t.dataset.id; Q.ban=Q.ban.includes(id)?Q.ban.filter(x=>x!==id):Q.ban.concat(id); render(); return; }
    case 'plreset': if(UI.pl){ UI.pl.ban=[]; render(); } return;
    case 'plok': poolDone(); return;
    case 'stats': UI.screen='stats'; UI.stOut=null; render(); scrollTop0(); return;
    case 'sttab': UI.stTab=t.dataset.t; UI.stOut=null; UI.stSort=null; UI.stDir=-1; render(); return;
    case 'stsort': { const k=t.dataset.k; if(UI.stSort===k) UI.stDir=-(UI.stDir||-1); else { UI.stSort=k; UI.stDir=-1; } render(); return; }
    case 'stcopy': { if((UI.stTab||'cards')==='camps'){ const a=statsAll(); copyText(['Date\tMode\tJoueurs\tPoints\tVainqueur'].concat(a.map(r=>[r.date,r.kind+' '+r.mode,r.names.join(', '),(r.pc||[]).join(' - '),r.winner>=0?r.names[r.winner]:'Égalité'].join('\t'))).join('\n')); } else copyText(statsTSV()); return; }
    case 'stjson': copyText(JSON.stringify(statsAll())); return;
    case 'stclear': if(UI.stArm){ statsWrite([]); UI.stArm=false; toast('Statistiques effacées.'); render(); } else { UI.stArm=true; toast('Clique encore une fois sur « Effacer les statistiques » pour confirmer.'); } return;
    case 'sturl': { const v=($('#sturl')||{}).value||''; try{ if(v.trim()) localStorage.setItem('zheroes_sheet_url',v.trim()); else localStorage.removeItem('zheroes_sheet_url'); }catch(e){} statsSendPending(); toast(v.trim()?'Adresse enregistrée : les campagnes seront envoyées au Google Sheet.':'Envoi désactivé.'); render(); return; }
    case 'dpal': dpClickAl(+t.dataset.id,t.dataset.key); return;
    case 'dpsel': { const D=UI.dp; if(!D||D.step!=='pick') return; const id=+t.dataset.id; if(D.sel.includes(id)) D.sel=D.sel.filter(x=>x!==id); else if(D.sel.length<3) D.sel.push(id); render(); return; }
    case 'dppage': if(UI.dp){ UI.dp.page+=+t.dataset.d; render(); } return;
    case 'dpnext': if(UI.dp&&UI.dp.sel.length===3){ UI.dp.step='anim'; UI.dp.animStarted=false; UI.dp.animDone={}; render(); scrollTop0(); } return;
    case 'dpback': dpBack(); return;
    case 'dpok': dpFinish(); return;
    case 'dprev': UI.dpage--; render(); return;
    case 'dnext': UI.dpage++; render(); return;
    case 'online': UI.screen='lobby'; NET.err=''; lobbyStart(); render(); return;
    case 'lretry': LBY.on=false; LBY.err=''; lbyStart(); lbyRefresh(); return;
    case 'lchat': lbySendChat(); return;
    case 'linvite': lbyInvitePlayer(t.dataset.uid); return;
    case 'nback': UI.screen='menu'; NET.err=''; render(); return;
    case 'nhost': { lbyCreate(); return; }
    case 't4start': if(TT.isHost){ if($('#t4lvl')) TT.aiLevel=$('#t4lvl').value; tourStart(); } return;
    case 't4go': if(TT.isHost) tourPlay(TT.T.round); return;
    case 't4prepgo': if(TT.isHost&&TT.T&&TT.T.phase==='prep'){ UI.tpAnim=null; tourStandings(0); } return;
    case 'nresume': { const hs=loadHostSave(); if(!hs) return; NET.mode=hs.mode; $('#nname')&&( $('#nname').value=hs.name ); hostTable(hs.code,hs.S); UI.screen='game'; return; }
    case 'njoin': joinTable(t.dataset.code); return;
    case 'njoincode': joinTable(($('#ncode')||{}).value); return;
    case 'nleave': UI.modal=null; if(TT.on) tourLeave(); netLeave(); return;
    case 'nhome': UI.modal=null; if(TT.on) tourLeave(); netLeave(); S=null; UI.screen='menu'; NET.err=''; render(); scrollTop0(); return;
    case 'nreconnect': { const c=NET.code; netLeave(); joinTable(c); return; }
    case 'ncopy': { const i=$('#nlink'); try{ navigator.clipboard.writeText(i.value).then(()=>toast('Lien copié !'),()=>{i.select();}); }catch(e){ i.select(); } return; }
    case 'tuto': startTuto(); return;
    case 'close': if(UI.modal&&UI.modal.back){UI.modal=UI.modal.back;renderModal();} else closeModal(); return;
    case 'rules': openModal({type:'rules'}); return;
    case 'cat': openModal({type:'cat'}); return;
    case 'catset': UI.modal=Object.assign({},UI.modal,{set:t.dataset.k}); renderModal(); return;
    case 'zoom': openModal({type:'zoom',id:+t.dataset.id,back:UI.modal&&UI.modal.type==='cat'?UI.modal:null}); return;
    case 'zoompl': openModal({type:'zoom',id:+t.dataset.id,pl:NET.on?NET.me:S.turn}); return;
    case 'menu': openModal({type:'confirmmenu'}); return;
    case 'gomenu': UI.modal=null; if(TT.on){ tourLeave(); netLeave(); return; } if(NET.on){ netLeave(); return; } S=null; render(); return;
    case 'endmenu': clearSave(); S=null; UI.dvSel=null; UI.dvPage=0; render(); return;
    case 'dvsel': UI.dvSel=+t.dataset.i; UI.dvPage=0; render(); return;
    case 'dvpage': { const n=+t.dataset.d; UI.dvPage=(UI.dvPage||0)+n; const g=document.querySelectorAll('.dvdots span').length||1; UI.dvPage=(UI.dvPage+g)%g; render(); return; }
    case 'resume': S=loadSaved(); render(); return;
    case 'new': { if($('#lvl')) lsSet('zh_lvl',$('#lvl').value); const np=$('#np')?+$('#np').value:2; if(np>2){ TT.aiLevel=($('#lvl')&&$('#lvl').value)||'normal'; soloStart($('#mode').value,np); return; }
      const ai=$('#opp')&&$('#opp').value==='ai'; const style='Adaptative'; setMyName($('#n1').value.trim()||myName()||'Joueur 1');
      newCampaign([$('#n1').value.trim()||'Joueur 1',ai?'IA':($('#n2').value.trim()||'Joueur 2')],$('#mode').value);
      if(ai){ S.ai=true; S.aiStyle=style; S.aiLevel=($('#lvl')&&$('#lvl').value)||'normal'; S.handoff=null; if(S.stc) S.stc.ai=AILVL_LBL[S.aiLevel]; }
      save(); render(); return; }
    case 'ready': S.handoff=null; save(); render(); return;
    case 'dpick': {if(TT.on&&!S){ if(UI.t4sent===TT.T.draft.round) return; const id=+t.dataset.id; UI.dpick=UI.dpick===id?null:id; render(); return;} if(NET.on){ if(UI.draftSent===`${S.game}-${S.draft.round}`) return; const id=+t.dataset.id; UI.dpick=UI.dpick===id?null:id; render(); return;} const D=S.draft,id=+t.dataset.id; D.picked=D.picked.includes(id)?[]:[id]; render(); return;}
    case 'dconfirm': { if(TT.on&&!S){ if(!UI.dpick) return; const r=TT.T.draft.round; UI.t4sent=r; if(TT.isHost) tourPick(0,r,UI.dpick); else TT.base.send({t:'dpick',round:r,id:UI.dpick}); render(); return; } if(NET.on){ if(!UI.dpick) return; UI.draftSent=`${S.game}-${S.draft.round}`; netAct({t:'draft',round:S.draft.round,id:UI.dpick}); render(); return; }
      const D=S.draft,pl=D.turn; D.picked.forEach(id=>stDraftPick(S.stc,pl,D.round+1,id,D.packs[pl])); P(pl).deck.push(...D.picked); D.packs[pl]=D.packs[pl].filter(x=>!D.picked.includes(x)); D.picked=[];
      if(pl===0){D.turn=1;S.handoff=1;}
      else {draftEndRound(D); D.turn=0;
        if(D.round>=12){ enterDraftPrep(); } else S.handoff=0;}
      save(); scrollTop0(); render(); return;}
    case 'startgame': startGame(); render(); return;
    case 'nextgame': S.game++; startGame(); render(); return;
    case 'place': {if(NET.on&&UI.placeSent===rkey()) return; const a=placeArr(); if(a.length<4) a.push(+t.dataset.id); render(); return;}
    case 'unplace': {if(NET.on&&UI.placeSent===rkey()) return; placeArr().splice(+t.dataset.k,1); render(); return;}
    case 'preset': if(NET.on&&UI.placeSent===rkey()) return; placeArr().length=0; render(); return;
    case 'pconfirm': if(NET.on){ const a=placeArr(); if(a.length!==4) return; UI.placeSent=rkey(); netAct({t:'place',key:rkey(),ids:a.slice()}); render(); scrollTop0(); return; } confirmPlacement(S.turn); scrollTop0(); render(); if(S.phase==='reveal') autoReveal(); return;
    case 'reveal': if(UI.auto||UI.anim) return; revealNext(); render(); autoReveal(); return;
    case 'tocombat': if(NET.on){ UI.readySent='combat-'+rkey(); netAct({t:'ready',what:'combat',key:rkey()}); render(); return; } if(UI.anim) return; startCombat(); render(); fightAnimated(true); return;
    case 'fight': if(NET.on){ netAct({t:'fight'}); return; } if(!UI.anim) fightAnimated(true); return;
    case 'autofight': if(!UI.anim) fightAnimated(true); return;
    case 'tococheph': if(NET.on){ UI.readySent='coche-'+rkey(); netAct({t:'ready',what:'coche',key:rkey()}); render(); return; } toCoche(); scrollTop0(); render(); return;
    case 'resolve': { const e=S.pending[+t.dataset.i]; if(!e||drawBusy()) return;
      if(NET.on){ if(e.pl!==NET.me) return; if(NET.host) clickResolve(e.pl,e.id); else { UI.armedLocal=e.pl+':'+e.id; netAct({t:'resolve',id:e.id}); render(); } return; }
      if(S.ai&&e.pl===AIP) return; clickResolve(e.pl,e.id); return; }
    case 'vp+': P(+t.dataset.pl).vp++; save(); render(); return;
    case 'vp-': P(+t.dataset.pl).vp--; save(); render(); return;
    case 'cundo': undoCoche(); return;
    case 'cnext': nextCoche(); return;

    case 'cprev': UI.ci=(UI.ci+3)%4; render(); return;
    case 'cfwd': UI.ci=(UI.ci+1)%4; render(); return;
    case 'kolist': { const pl=+t.dataset.pl; openModal({type:'kolist',pl}); return; }
    case 'open': {const pl=t.dataset.pl;if(pl===''||pl==null) return; openModal({type:'card',pl:+pl,id:+t.dataset.id}); return;}
  }
  const m=UI.modal; if(!m||m.type!=='card') return;
  if(!S||S.phase!=='coche') return; // aucune modification manuelle hors phase de coche
  const {pl,id}=m; const p=P(pl); const idx=p.line.findIndex(u=>u.id===id); const u=p.line[idx];
  switch(act){
    case 'tok+': if(u) u.tok++; break;
    case 'tok-': if(u){u.tok--; if(u.tok<=0){destroyUnit(pl,idx,'par un effet'); checkEnd(); closeModal();}} break;
    case 'sh+': if(u) u.sh++; break;

    case 'revive': p.ko=p.ko.filter(x=>x!==id); p.line.push({id,tok:1,sh:0,rev:true,pl}); logm(`${DEF[id].name} revient en jeu en dernier avec 1 ♥.`); closeModal(); break;
  }
  save(); render();
});
